name: Check packages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    uses: ./.github/workflows/secrets.yml
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/package.py check
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/package.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-mining-packages-${{ matrix.os }}
          path: dist/
  compare:
    name: Compare release packages
    needs: [check, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: automation-mining-packages-*
          path: packages/
      - name: Compare package bytes
        run: |
          diff -u packages/automation-mining-packages-ubuntu-latest/SHA256SUMS packages/automation-mining-packages-windows-latest/SHA256SUMS
          cd packages/automation-mining-packages-ubuntu-latest
          sha256sum -c SHA256SUMS
