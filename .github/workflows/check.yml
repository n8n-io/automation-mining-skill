name: Check packages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    uses: ./.github/workflows/secrets.yml
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/package.py check
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/package.py build
      - name: Verify downloads on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          Get-Content .\SHA256SUMS | ForEach-Object {
              $expected, $name = $_ -split '  ', 2
              $actual = (Get-FileHash -LiteralPath $name -Algorithm SHA256 -ErrorAction Stop).Hash
              if ($actual -ne $expected) { throw "Checksum mismatch: $name" }
              Write-Output "OK: $name"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-mining-packages-${{ matrix.os }}
          path: dist/
  compare:
    name: Compare release packages
    needs: [check, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: automation-mining-packages-*
          path: packages/
      - name: Compare package bytes
        run: |
          diff -u packages/automation-mining-packages-ubuntu-latest/SHA256SUMS packages/automation-mining-packages-windows-latest/SHA256SUMS
          cd packages/automation-mining-packages-ubuntu-latest
          sha256sum -c SHA256SUMS
